<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMO - Pasos para toda tu vida</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/Styles.css">
    <style>
        /* Botones de categoría activos */
        nav a.categoria-activa {
            color: var(--dorado);
            border-bottom: 2px solid var(--dorado);
            padding-bottom: 4px;
        }
        
        /* Animación suave para las tarjetas */
        .producto-card {
            transition: all 0.3s ease;
        }
        
        /* Mensaje cuando no hay productos */
        .sin-resultados {
            text-align: center;
            padding: 3rem;
            color: var(--azul-profundo);
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIMO <span>Pasos para toda tu vida</span></div>
        <nav>
            <ul>
                <li><a href="#" class="filtro-categoria categoria-activa" data-categoria="todos">Catálogo</a></li>
                <li><a href="#" class="filtro-categoria" data-categoria="Hombre">Hombre</a></li>
                <li><a href="#" class="filtro-categoria" data-categoria="Mujer">Mujer</a></li>
                <li><a href="#" class="filtro-categoria" data-categoria="Niños">Niños</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <a href="login.html">👤</a>
            <a href="carrito.html"></a>
        </div>
    </header>

    <section class="hero">
        <h1>Encuentra tu paso perfecto</h1>
        <p>Comodidad y estilo en cada zapato.</p>
    </section>

    <main class="catalogo-container">
        <!-- Filtros (RF10) -->
        <aside class="filtros">
            <h3>Filtros</h3>
            <div class="form-group">
                <label>Categoría</label>
                <select id="filtro-categoria">
                    <option value="todos">Todos</option>
                    <option value="Deportivo">Deportivos</option>
                    <option value="Casual">Casual</option>
                    <option value="Formal">Formal</option>
                </select>
            </div>
            <div class="form-group">
                <label>Talla</label>
                <select id="filtro-talla">
                    <option value="todas">Todas</option>
                    <option value="38">38</option>
                    <option value="39">39</option>
                    <option value="40">40</option>
                    <option value="41">41</option>
                    <option value="42">42</option>
                </select>
            </div>
            <div class="form-group">
                <label>Marca</label>
                <select id="filtro-marca">
                    <option value="todas">Todas</option>
                    <option value="Nike">Nike</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Timberland">Timberland</option>
                </select>
            </div>
            <button class="btn btn-primary" id="btn-aplicar-filtros" style="width: 100%;">Aplicar</button>
            <button class="btn btn-secondary" id="btn-limpiar-filtros" style="width: 100%; margin-top: 0.5rem;">Limpiar filtros</button>
        </aside>

        <!-- Grid de Productos (RF07, RF09, RF10) -->
        <section class="productos-grid" id="productos-grid">
            <!-- Los productos se cargarán dinámicamente con JavaScript -->
        </section>
    </main>

    <footer>
        <p>© 2026 MIMO. Pasos para toda tu vida.</p>
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
