<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador - MIMO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/Styles.css">
    <style>
        /* Pequeño ajuste para diferenciar visualmente el login de admin */
        .admin-badge {
            background-color: var(--azul-noche);
            color: var(--dorado);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIMO <span>Panel Administrativo</span></div>
    </header>

    <main class="form-container">
        <div style="text-align: center;">
            <span class="admin-badge">ACCESO RESTRINGIDO</span>
        </div>
        <h2>Ingreso Administrador</h2>
        <form action="admin-productos.html" method="POST">
            <div class="form-group">
                <label for="admin-correo">Usuario / Correo</label>
                <input type="text" id="admin-correo" name="admin-correo" required>
            </div>
            <div class="form-group">
                <label for="admin-contrasena">Contraseña</label>
                <input type="password" id="admin-contrasena" name="admin-contrasena" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Entrar al Panel</button>
        </form>
    </main>

    <footer>
        <p>© 2026 MIMO. Sistema de Gestión Interna.</p>
    </footer>

</body>
</html>
